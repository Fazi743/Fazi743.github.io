<!-- start custom footer snippets -->
<script>
(function () {
  var footer = document.querySelector('.page__footer');
  if (!footer) return;

  var hasScrolled = false;

  function nearBottom() {
    var scrolled = window.innerHeight + window.scrollY;
    var full = document.documentElement.scrollHeight;
    return full - scrolled < 150;
  }

  function pageCanScroll() {
    return document.documentElement.scrollHeight > window.innerHeight + 10;
  }

  function check() {
    if (!pageCanScroll()) {            // nothing to scroll: show it
      footer.classList.add('is-visible');
      return;
    }
    if (hasScrolled && nearBottom()) footer.classList.add('is-visible');
    else footer.classList.remove('is-visible');
  }

  window.addEventListener('scroll', function () {
    hasScrolled = true;
    check();
  }, { passive: true });
  window.addEventListener('resize', check);
  window.addEventListener('load', check);   // run after images load so heights are correct
})();
</script>

<!-- Support for MathJax -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
<!-- end custom footer snippets -->
